# =====================================================================
# 추세매매 자동화 설정 파일
# 이동평균(이평선)이 우상향할 때 매수하고, 우하향으로 꺾이면 청산합니다.
# =====================================================================

# ---------------------------------------------------------------------
# 대상 종목 / 데이터
# ---------------------------------------------------------------------
market:
  # 데이터 소스: "csv"(파일) 또는 "fdr"(FinanceDataReader - 국내/해외 주가)
  source: "csv"
  symbol: "005930"           # 종목코드 (예: 005930 삼성전자, AAPL 애플)
  start: "2021-01-01"        # source=fdr 조회 시작일
  end: null                  # source=fdr 조회 종료일 (null=오늘)
  csv_path: "data/sample_ohlcv.csv"   # source=csv 일 때 사용할 파일

# ---------------------------------------------------------------------
# 전략 파라미터 (추세매매)
# ---------------------------------------------------------------------
strategy:
  ma_type: "ema"             # 이동평균 종류: "sma"(단순) 또는 "ema"(지수)
  ma_period: 20              # 이평선 기간
  slope_lookback: 3          # 기울기 측정 구간 (N봉 전 대비 현재 이평선)
  slope_threshold: 0.0       # 우상향 판정 임계값(기울기 %) — 0보다 크면 상승
  use_dual_ma: true          # 장/단기 이평선 정배열 조건 추가 사용 여부
  fast_period: 10            # use_dual_ma=true 일 때 단기 이평선
  slow_period: 30            # use_dual_ma=true 일 때 장기 이평선
  price_above_ma: true       # 종가가 이평선 위에 있을 때만 진입

  # 리스크 관리 (0 이면 미사용)
  stop_loss_pct: 5.0         # 손절 % (진입가 대비 -5%)
  take_profit_pct: 0.0       # 익절 % (0=미사용, 추세추종은 보통 미사용)

# ---------------------------------------------------------------------
# 계좌 / 주문
# ---------------------------------------------------------------------
account:
  initial_cash: 10000000     # 초기 자본 (원)
  order_ratio: 0.99          # 매수 시 사용할 현금 비율 (0~1)
  fee_pct: 0.015             # 증권사 매매수수료 % (편도, 국내주식 대략치)
  slippage_pct: 0.05         # 슬리피지 % (체결 미끄러짐)
  # 참고: 국내주식 매도 시 증권거래세(약 0.18%)가 별도 부과됩니다.
  #       보수적 검증을 원하면 fee_pct 를 0.1 이상으로 올려 잡으세요.

# ---------------------------------------------------------------------
# 실행 모드
#   backtest : 과거 데이터로 전략 검증
#   paper    : 실시간 시세로 가상매매 (주문은 로그만, 실거래 아님)
#   live     : 실거래 (아직 미구현 — 브로커 인터페이스만 준비됨)
# ---------------------------------------------------------------------
run:
  mode: "backtest"
  poll_interval_sec: 300     # paper/live 모드에서 시세 확인 주기(초)
  log_level: "INFO"
